<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Frame 1 — One command (wireframe)</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: Inter, -apple-system, system-ui, sans-serif;
          color: #f4f8ff;
        }
        #f1-plane {
          position: absolute;
          inset: 0;
          background: #070b11;
        }
        #f1-eyebrow {
          position: absolute;
          left: 84px;
          top: 132px;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #f08a24;
        }
        #f1-term {
          position: absolute;
          left: 84px;
          top: 300px;
          width: 500px;
          height: 240px;
          border: 1px solid #111c2d;
          border-radius: 10px;
          background: #0b1320;
          box-sizing: border-box;
          padding: 28px 32px;
        }
        #f1-cmd {
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 44px;
          font-weight: 600;
          color: #f4f8ff;
          white-space: nowrap;
        }
        #f1-caret {
          display: inline-block;
          width: 3px;
          height: 44px;
          background: #f08a24;
          vertical-align: -6px;
          margin-left: 6px;
        }
        #f1-termhint {
          margin-top: 22px;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 19px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #607089;
        }
        #f1-qr {
          /* Position must match #f3-qr in 03-one-scan.html exactly (640/300).
             The storyboard promises the QR holds still across the cut while the
             phone turns to face it; two different positions would read as a pop. */
          position: absolute;
          left: 640px;
          top: 300px;
          width: 300px;
          height: 300px;
          border: 1px solid #111c2d;
          border-radius: 10px;
          background: #0b1320;
          display: grid;
          place-items: center;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 18px;
          letter-spacing: 0.12em;
          color: #9fb0c9;
          text-align: center;
          box-sizing: border-box;
        }
        #f1-headline {
          position: absolute;
          left: 84px;
          top: 636px;
          width: 560px;
          font-size: 92px;
          font-weight: 700;
          line-height: 0.98;
          letter-spacing: -0.02em;
          color: #f4f8ff;
        }
        #f1-sub {
          position: absolute;
          left: 86px;
          top: 852px;
          width: 540px;
          font-size: 30px;
          font-weight: 400;
          line-height: 1.35;
          color: #9fb0c9;
        }
        .wf-tag {
          position: absolute;
          right: 22px;
          bottom: 16px;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 15px;
          letter-spacing: 0.1em;
          color: #6b7a91;
        }
      </style>

      <div data-hf-id="hf-f7km" id="root" data-composition-id="01-one-command" data-width="1080" data-height="1080">
        <div data-hf-id="hf-a48b" id="f1-plane"></div>
        <div data-hf-id="hf-68m7" id="f1-eyebrow">// on your computer</div>
        <div data-hf-id="hf-fu35" id="f1-term">
          <div data-hf-id="hf-bggl" id="f1-cmd"><span data-hf-id="hf-w5qv" id="f1-cmdtext"></span><span data-hf-id="hf-xkg3" id="f1-caret"></span></div>
          <div data-hf-id="hf-rspq" id="f1-termhint">prints a pair QR</div>
        </div>
        <div data-hf-id="hf-du8o" id="f1-qr">[ QR BLOCK ]</div>
        <div data-hf-id="hf-cx66" id="f1-headline">one command.</div>
        <div data-hf-id="hf-sdqn" id="f1-sub">Your machine stays yours. Threadbase just connects to it.</div>
        <div data-hf-id="hf-wdct" class="wf-tag">wireframe · frame 1</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });
          const cmd = "$ tb pair";
          const target = document.getElementById("f1-cmdtext");

          tl.fromTo("#f1-eyebrow", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
          tl.fromTo("#f1-term", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.2);

          // Typed one character at a time — seek-safe because it is a stepped
          // tween over an index, not a render-time clock.
          const typed = { i: 0 };
          tl.to(
            typed,
            {
              i: cmd.length,
              duration: 1.1,
              ease: "none",
              onUpdate: () => {
                target.textContent = cmd.slice(0, Math.round(typed.i));
              },
            },
            0.55,
          );

          tl.fromTo("#f1-caret", { opacity: 1 }, { opacity: 0, duration: 0.28, repeat: 5, yoyo: true, ease: "none" }, 1.7);
          tl.fromTo("#f1-termhint", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.85);
          tl.fromTo("#f1-qr", { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 2.1);
          tl.fromTo("#f1-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.45);
          tl.fromTo("#f1-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.7);

          window.__timelines["01-one-command"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
