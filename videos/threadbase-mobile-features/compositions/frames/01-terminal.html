<template data-composition-id="03-terminal">
  <style>
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/Inter-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "Inter", Georgia, serif;
    }

    /* full-bleed ink ground on its own clip layer (never on #root) */
    .terminal-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 22%, #16181d 0%, #0A0E14 62%, #06080c 100%);
    }

    /* subtle VT100 scanline field over the ink */
    .terminal-scan {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(93, 184, 166, 0.05) 0px,
        rgba(93, 184, 166, 0.05) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    /* kicker chrome */
    .terminal-kicker {
      position: absolute;
      top: 62px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 25px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6b7280;
    }
    .terminal-kicker .spike { color: #4C82F7; }

    /* camera rig — push-in happens here */
    .terminal-rig {
      position: absolute;
      left: 50%;
      top: 300px;
      width: 300px;
      transform-origin: 50% 30%;
      will-change: transform;
    }

    /* phone device mockup */
    .terminal-device {
      position: relative;
      width: 300px;
      aspect-ratio: 1242 / 2688;
      border-radius: 46px;
      background: #05070b;
      padding: 9px;
      box-shadow:
        0 1px 3px rgba(10, 14, 20, 0.5),
        0 24px 70px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(230, 237, 243, 0.10);
    }
    .terminal-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 38px;
      overflow: hidden;
      background: #0A0E14;
    }
    .terminal-screen img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* coral karaoke glow strip over the `git status` command line.
       positioned in screenshot-percentage space so it tracks the push-in. */
    .terminal-cmd-glow {
      position: absolute;
      left: 4.5%;
      top: 19.3%;
      width: 62%;
      height: 3.4%;
      border-radius: 4px;
      background: linear-gradient(90deg,
        rgba(76, 130, 247, 0.0) 0%,
        rgba(76, 130, 247, 0.55) 50%,
        rgba(76, 130, 247, 0.0) 100%);
      mix-blend-mode: screen;
      opacity: 0;
      will-change: opacity, transform;
    }

    /* green output-row highlight dots (foreground layer) */
    .terminal-dot {
      position: absolute;
      left: 2.4%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #3DDC97;
      box-shadow: 0 0 10px 2px rgba(61, 220, 151, 0.7);
      opacity: 0;
      will-change: opacity, transform;
    }
    .terminal-dot.r1 { top: 30.0%; }
    .terminal-dot.r2 { top: 31.3%; }
    .terminal-dot.r3 { top: 44.5%; }

    /* faint row sweep behind the dots */
    .terminal-rowsweep {
      position: absolute;
      left: 2.0%;
      width: 88%;
      height: 1.6%;
      border-radius: 4px;
      background: rgba(61, 220, 151, 0.18);
      opacity: 0;
      will-change: opacity;
    }
    .terminal-rowsweep.s1 { top: 29.4%; }
    .terminal-rowsweep.s2 { top: 43.9%; }

    /* device screen vignette to seat it into the ink */
    .terminal-vignette {
      position: absolute;
      inset: 0;
      border-radius: 38px;
      pointer-events: none;
      box-shadow: inset 0 0 60px rgba(5, 7, 11, 0.55);
    }
  </style>

  <div data-hf-id="hf-n3wy" id="root" data-composition-id="03-terminal" data-start="0" data-duration="5.463" data-width="1080" data-height="1080">
    <div data-hf-id="hf-4lkk" class="terminal-bg clip" data-start="0" data-duration="5.463" data-track-index="0"></div>
    <div data-hf-id="hf-boun" class="terminal-scan clip" data-start="0" data-duration="5.463" data-track-index="1"></div>

    <div data-hf-id="hf-n06t" class="terminal-kicker clip" data-start="0" data-duration="5.463" data-track-index="2">
      <span data-hf-id="hf-3274" class="spike">✱</span> The terminal, in your pocket
    </div>

    <div data-hf-id="hf-pwl0" class="terminal-rig clip" data-start="0" data-duration="5.463" data-track-index="3">
      <div data-hf-id="hf-i4vz" class="terminal-device">
        <div data-hf-id="hf-vlrd" class="terminal-screen">
          <img data-hf-id="hf-ej8s" src="assets/terminal.png" alt="Threadbase mobile session — Bash tool call and output">
          <div data-hf-id="hf-utsv" class="terminal-rowsweep s1"></div>
          <div data-hf-id="hf-q7w4" class="terminal-rowsweep s2"></div>
          <div data-hf-id="hf-h7qb" class="terminal-cmd-glow"></div>
          <div data-hf-id="hf-9asl" class="terminal-dot r1"></div>
          <div data-hf-id="hf-d8wm" class="terminal-dot r2"></div>
          <div data-hf-id="hf-jemf" class="terminal-dot r3"></div>
          <div data-hf-id="hf-b3ez" class="terminal-vignette"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-terminal"] = tl;

      var DUR = 4.963;

      // Scene 1 (0.0–1.8): device holds, grown slightly in from the slide.
      gsap.set(".terminal-rig", { scale: 0.94, y: 0 });
      tl.fromTo(
        ".terminal-rig",
        { scale: 0.94, y: 6, opacity: 0.0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0
      );

      // Scene 2 (1.8–3.6): slow camera push-IN toward the Bash block.
      // origin is 50% 30% (the command region), so scale reads as a dolly-in.
      tl.to(
        ".terminal-rig",
        { scale: 1.28, duration: 2.4, ease: "power1.inOut" },
        1.6
      );

      // coral karaoke glow sweeps L→R across `git status` on its VO cue (~1.9s).
      // asr-keyword-glow: linear driver, envelope drives opacity + a translateX wipe.
      var glow = document.querySelector(".terminal-cmd-glow");
      var driver = { t: 0 };
      var G_START = 1.9;   // "every command"
      var G_END = 2.6;
      var ATTACK = 0.22;
      var RELEASE = 0.5;
      var REST = 0.12;
      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST);
        return REST;
      }
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var env = envelope(driver.t, G_START, G_END);
            if (glow) {
              glow.style.opacity = String(0.15 + 0.85 * env);
              // left→right karaoke wipe of the bright core
              glow.style.transform =
                "translateX(" + (-20 + 40 * Math.min((driver.t - G_START) / 0.7, 1)) + "%)";
            }
          },
        },
        0
      );

      // Scene 3 (3.6–6.0): output rows highlight in sequence, then settle + HOLD.
      // green dots + faint row sweeps stagger in on "every line of output" (~3.4s).
      tl.fromTo(
        ".terminal-rowsweep.s1",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        3.35
      );
      tl.fromTo(
        [".terminal-dot.r1", ".terminal-dot.r2"],
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.14 },
        3.45
      );
      tl.fromTo(
        ".terminal-rowsweep.s2",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        3.85
      );
      tl.fromTo(
        ".terminal-dot.r3",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" },
        3.95
      );

      // settle the push so it HOLDS on the last beat.
      tl.to(
        ".terminal-rig",
        { scale: 1.3, duration: 1.0, ease: "power2.out" },
        4.0
      );
    })();
  </script>
